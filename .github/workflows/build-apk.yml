name: Build CONTINENT VPN Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_github_release:
        description: 'Publish as a GitHub Release (if tag or manual release)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 🛡️ Build Standalone Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🔍 TypeScript Type Check
        run: pnpm typecheck

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🔨 Build Android APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          BUILD_VARIANT="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_VARIANT" = "debug" ]; then
            echo "Building Debug APK..."
            ./gradlew assembleDebug --no-daemon
          else
            echo "Building Release APK..."
            ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          fi

      - name: 📦 Locate and Prepare APK Artifact
        shell: bash
        run: |
          mkdir -p build-output
          # Search for generated APKs
          APK_FILES=$(find android/app/build/outputs/apk -type f -name "*.apk")
          echo "Found APK files:"
          echo "$APK_FILES"
          
          # Pick release or debug apk
          PRIMARY_APK=$(find android/app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -z "$PRIMARY_APK" ]; then
            PRIMARY_APK=$(find android/app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          fi
          
          if [ -n "$PRIMARY_APK" ]; then
            VERSION="1.0.0"
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
            fi
            TARGET_NAME="continent-vpn-mobile-v${VERSION}-build${{ github.run_number }}.apk"
            cp "$PRIMARY_APK" "build-output/$TARGET_NAME"
            echo "Prepared primary artifact: build-output/$TARGET_NAME"
            echo "PRIMARY_APK_PATH=build-output/$TARGET_NAME" >> $GITHUB_ENV
            echo "PRIMARY_APK_NAME=$TARGET_NAME" >> $GITHUB_ENV
          else
            echo "❌ No APK was found in the build output!"
            exit 1
          fi

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: continent-vpn-android-apk
          path: build-output/*.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          name: CONTINENT VPN v${{ github.ref_name }}
          body: |
            ### 🛡️ CONTINENT VPN Mobile — Release ${{ github.ref_name }}
            
            Téléchargez l'application Android directement via le fichier APK ci-joint :
            - **Fichier** : `${{ env.PRIMARY_APK_NAME }}`
            - **Architecture** : React Native (Expo SDK 54, TypeScript)
            - **Sécurité** : Chiffrement quantique de bout en bout, Zéro-Journal, Kill Switch
            
            #### Instructions d'installation :
            1. Téléchargez `${{ env.PRIMARY_APK_NAME }}` sur votre smartphone Android.
            2. Ouvrez le fichier et autorisez l'installation d'applications de sources inconnues si demandé.
            3. Lancez CONTINENT VPN et activez votre bouclier souverain !
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
