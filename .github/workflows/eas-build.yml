name: EAS Build Android APK (Cloud)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview or production-apk)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production-apk
          - production

jobs:
  eas-build:
    name: ☁️ EAS Cloud Build APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🚀 Setup Expo CLI and EAS CLI
        run: pnpm add -g eas-cli

      - name: 🔨 Trigger EAS Build
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
